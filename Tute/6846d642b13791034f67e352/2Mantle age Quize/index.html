<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Mental Age Quiz</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <button class="toggle-mode" onclick="toggleDarkMode()">Toggle Dark Mode</button>
        <br>
        <h1>🌸 What's Your Mental Age?</h1>
        <form id="quizForm"></form>
    </div>
    <script>
        const quizData = [
            ["How do you spend your weekend?", [["Gaming & snacks", 10], ["Music & sleep", 20], ["Cleaning & errands", 30]]],
            ["Your favorite kind of music?", [["Pop & TikTok hits", 10], ["Lofi & chillhop", 20], ["Classical & jazz", 30]]],
            ["What's your favorite snack?", [["Candy & gummies", 10], ["Chips & cookies", 20], ["Nuts & fruit", 30]]],
            ["How do you deal with stress?", [["Cry or nap", 10], ["Ignore it", 20], ["Handle it calmly", 30]]],
            ["Favorite type of movie?", [["Cartoons", 10], ["Rom-coms", 20], ["Documentaries", 30]]],
            ["What's your dream vacation?", [["Disneyland", 10], ["Beach resort", 20], ["Historic cities", 30]]],
            ["Do you believe in magic?", [["Absolutely! 🧪", 10], ["Maybe...", 20], ["No, I'm realistic", 30]]]
        ];

        const form = document.getElementById("quizForm");
        quizData.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question-container" + (i === 0 ? " active" : "");
            div.dataset.question = i + 1;
            let inner = `<p>${i + 1}. ${q[0]}</p><div class="options">`;
            q[1].forEach((opt, j) => {
                inner += `
      <input type="radio" id="q${i + 1}a${j}" name="q${i + 1}" value="${opt[1]}">
      <label for="q${i + 1}a${j}">${opt[0]}</label>`;
            });
            inner += `</div><button type="button" onclick="${i === quizData.length - 1 ? 'showResult()' : 'nextQuestion()'}">${i === quizData.length - 1 ? 'Finish' : 'Next'}</button>`;
            div.innerHTML = inner;
            form.appendChild(div);
        });

        let current = 0;
        const questions = document.querySelectorAll('.question-container');

        function nextQuestion() {
            const currentContainer = questions[current];
            const selected = currentContainer.querySelector('input[type="radio"]:checked');
            if (!selected) {
                alert("Please select an answer before continuing.");
                return;
            }
            currentContainer.style.transform = "translateX(-100%)";
            currentContainer.style.opacity = "0";
            setTimeout(() => {
                currentContainer.classList.remove('active');
                current++;
                if (questions[current]) {
                    questions[current].style.transform = "translateX(100%)";
                    questions[current].classList.add('active');
                    setTimeout(() => {
                        questions[current].style.transform = "translateX(0)";
                        questions[current].style.opacity = "1";
                    }, 10);
                }
            }, 300);
        }

        function showResult() {
            const currentContainer = questions[current];
            const selected = currentContainer.querySelector('input[type="radio"]:checked');
            if (!selected) {
                alert("Please select an answer before finishing.");
                return;
            }
            currentContainer.style.transform = "translateX(-100%)";
            currentContainer.style.opacity = "0";
            setTimeout(() => {
                currentContainer.classList.remove("active");
                let total = 0;
                for (let i = 1; i <= quizData.length; i++) {
                    const val = document.querySelector(`input[name="q${i}"]:checked`);
                    if (val) total += parseInt(val.value);
                }
                const avg = Math.round(total / quizData.length);
                let resultText = `✨ Your mental age is <strong>${avg}</strong>!`;
                if (avg <= 15) resultText += '<br><em>You have a youthful and playful spirit! 🎈</em>';
                else if (avg <= 25) resultText += '<br><em>You have a chill and balanced vibe! 🌙</em>';
                else resultText += '<br><em>You are mature and wise beyond your years. 📚</em>';
                form.innerHTML = `<div id="result">${resultText}</div>`;
            }, 300);
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>
</body>

</html>
