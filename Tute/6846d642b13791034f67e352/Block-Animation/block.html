    let topDiv = document.getElementById("top");
    let bottomDiv = document.getElementById("bottom");

    let backDiv = document.getElementById("back");
    let rightDiv = document.getElementById("right");
    let leftDiv = document.getElementById("left");

    setInterval(() => {
        topDiv.style.backgroundColor = genrateColor();
        bottomDiv.style.backgroundColor = genrateColor();
        frontDiv.style.backgroundColor = genrateColor();
        backDiv.style.backgroundColor = genrateColor();
        rightDiv.style.backgroundColor = genrateColor();
        leftDiv.style.backgroundColor = genrateColor();
    }, 2000);

    function genrateColor() {
        let redColor = 0;
        let greenColor = 0;
        let blueColor = 0;
        let maxNum = 225;

        redColor = Math.round(Math.abs(Math.random() * 300));
        greenColor = Math.round(Math.abs(Math.random() * 300));
        blueColor = Math.round(Math.abs(Math.random() * 300));

        while (redColor > maxNum) {
            redColor = Math.round(Math.abs(Math.random() * 300));
        }
        while (greenColor > maxNum) {
            greenColor = Math.round(Math.abs(Math.random() * 300));
        }
        while (blueColor > maxNum) {
            blueColor = Math.round(Math.abs(Math.random() * 300));
        }
        return `rgb(${redColor}, ${greenColor}, ${blueColor})`;
    }
